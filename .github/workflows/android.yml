name: Compile Android APK

on:
  push:
    branches:
      - main  # Change to "master" if your primary branch is named master
  workflow_dispatch: # Allows you to manually click a button to start the build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Speeds up future builds

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcXstrike-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
